name: Playwright E2E
description: Run Playwright E2E tests against a given base_url (in the Playwright container)
inputs:
  base_url:
    required: true
  node_version:
    required: false
    default: '24'
runs:
  using: composite
  steps:
    - uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node_version }}
        cache: npm

    - name: Install deps
      shell: bash
      run: npm ci --prefer-offline

    # Browsers + OS deps are preinstalled in the Playwright container image
    # (PLAYWRIGHT_BROWSERS_PATH is preset to /ms-playwright by the image — do
    # not override it). No `playwright install` / browser cache needed here.
    - name: Run E2E
      if: ${{ inputs.base_url != '' }}
      shell: bash
      env:
        PLAYWRIGHT_BASE_URL: ${{ inputs.base_url }}
      run: npx nx run-many -t e2e --output-style=stream
