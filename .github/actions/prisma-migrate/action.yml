name: Prisma migrate
description: Run 'prisma migrate deploy' via NX with retries, and optionally seed the database
inputs:
  nx_target:
    required: true
    type: string
    default: 'migrate-deploy prisma-client'
  database_url:
    required: true
    type: string
  direct_database_url:
    required: true
    type: string
  attempts:
    required: false
    type: string
    default: '3'
  seed_admin_email:
    required: false
    type: string
    default: ''
  seed_admin_password:
    required: false
    type: string
    default: ''
  firebase_service_account_json_b64:
    required: false
    type: string
    default: ''
runs:
  using: composite
  steps:
    - name: Migrate deploy (with retry)
      shell: bash
      env:
        DATABASE_URL: ${{ inputs.database_url }}
        DIRECT_DATABASE_URL: ${{ inputs.direct_database_url }}
      run: |
        set -e
        attempts=${attempts:-3}
        delay=10
        ok=0
        for i in $(seq 1 $attempts); do
          echo "Attempt $i/$attempts: prisma migrate deploy"
          if npx nx ${{ inputs.nx_target }}; then ok=1; break; fi
          echo "Failed attempt $i. Retrying in ${delay}s..."
          sleep $delay; delay=$((delay*2))
        done
        [ "$ok" -eq 1 ] || { echo "❌ migrate deploy failed"; exit 1; }

    - name: Optional seed
      if: ${{ inputs.database_url != '' && inputs.seed_admin_email != '' && inputs.seed_admin_password != '' }}
      shell: bash
      env:
        DATABASE_URL: ${{ inputs.database_url }}
        DIRECT_DATABASE_URL: ${{ inputs.direct_database_url }}
        SEED_ADMIN_EMAIL: ${{ inputs.seed_admin_email }}
        SEED_ADMIN_PASSWORD: ${{ inputs.seed_admin_password }}
        FIREBASE_SERVICE_ACCOUNT_JSON_B64: ${{ inputs.firebase_service_account_json_b64 }}
      run: npx nx seed prisma-client
