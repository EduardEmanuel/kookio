name: _e2e
on:
  workflow_call:
    inputs:
      base_url:
        required: true
        type: string
      node_version:
        required: false
        type: string
        default: '24'

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    # Official Playwright image ships browsers + OS deps preinstalled, so the
    # action skips `playwright install --with-deps` (apt + browser download).
    # Pin the tag to the @playwright/test version in package-lock.json — a
    # drift between the two causes a silent browser/driver mismatch at runtime.
    container:
      image: mcr.microsoft.com/playwright:v1.60.0-jammy
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Playwright E2E
        if: ${{ inputs.base_url != '' }}
        uses: ./.github/actions/playwright-e2e
        with:
          base_url: ${{ inputs.base_url }}
          node_version: ${{ inputs.node_version }}

      - name: Skip E2E (no base_url)
        if: ${{ inputs.base_url == '' }}
        run: echo "⚠️ No base_url provided; skipping E2E."

      - name: Upload Playwright report on failure
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: dist/.playwright/**/playwright-report
          retention-days: 7
