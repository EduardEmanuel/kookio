name: CI & Migrate
on:
  push:
    branches: [main, test, dev]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ci-cd-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 1) CI (reusable)
  ci:
    uses: ./.github/workflows/_ci.yml
    with:
      node_version: ${{ vars.NODE_VERSION }}

  # 1b) Notify on CI failure
  notify-ci-failed:
    needs: ci
    if: ${{ failure() && needs.ci.result == 'failure' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - uses: ./.github/actions/discord-notify
        with:
          webhook_url: ${{ secrets.DISCORD_WEBHOOK }}
          event_type: ci_failed

  # 1c) Coverage floor — full-workspace library coverage, parallel to ci.
  # Runs outside Nx (the Nx executor swallows --coverage.* args), so it can't
  # be an affected step; it gates the whole libs/ aggregate via bench-coverage.
  coverage:
    if: ${{ github.event_name == 'pull_request' || github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - uses: ./.github/actions/setup-npm
        with:
          node_version: ${{ vars.NODE_VERSION }}
      - name: Enforce library coverage floor (80% lines)
        run: COVERAGE_MIN=80 npm run bench:coverage

  # 2) Migrate DEV
  migrate-dev:
    if: ${{ github.ref == 'refs/heads/dev' }}
    needs: ci
    runs-on: ubuntu-latest
    environment: development
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-npm
        with:
          node_version: ${{ vars.NODE_VERSION }}
      - uses: ./.github/actions/prisma-migrate
        with:
          database_url: ${{ secrets.KOOKIO_MIGRATE_CONNECTION }}
          direct_database_url: ${{ secrets.KOOKIO_MIGRATE_CONNECTION }}
          seed_admin_email: ${{ secrets.SEED_ADMIN_EMAIL }}
          seed_admin_password: ${{ secrets.SEED_ADMIN_PASSWORD }}
          firebase_service_account_json_b64: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON_B64 }}
      - name: Notify Discord on failure
        if: ${{ failure() }}
        uses: ./.github/actions/discord-notify
        with:
          webhook_url: ${{ secrets.DISCORD_WEBHOOK }}
          event_type: dev_migrate_failed

  # 3) Migrate TEST
  migrate-test:
    if: ${{ github.ref == 'refs/heads/test' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork == false) }}
    needs: ci
    runs-on: ubuntu-latest
    environment: testing
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-npm
        with:
          node_version: ${{ vars.NODE_VERSION }}
      - uses: ./.github/actions/prisma-migrate
        with:
          database_url: ${{ secrets.KOOKIO_MIGRATE_CONNECTION }}
          direct_database_url: ${{ secrets.KOOKIO_MIGRATE_CONNECTION }}
          seed_admin_email: ${{ secrets.SEED_ADMIN_EMAIL }}
          seed_admin_password: ${{ secrets.SEED_ADMIN_PASSWORD }}
          firebase_service_account_json_b64: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON_B64 }}
      - name: Notify Discord on failure
        if: ${{ failure() }}
        uses: ./.github/actions/discord-notify
        with:
          webhook_url: ${{ secrets.DISCORD_WEBHOOK }}
          event_type: test_migrate_failed

  # 4) Resolve URL (dev/test/PR)
  resolve-url:
    if: ${{ github.ref == 'refs/heads/test' || github.ref == 'refs/heads/dev' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork == false) }}
    needs: [ci]
    runs-on: ubuntu-latest
    outputs:
      base_url: ${{ steps.r.outputs.base_url }}
      source: ${{ steps.r.outputs.source }}
      branch: ${{ steps.r.outputs.branch_used }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - id: r
        uses: ./.github/actions/resolve-vercel-url
        with:
          vercel_app_url: ${{ vars.VERCEL_APP_URL }}
          vercel_token: ${{ secrets.VERCEL_TOKEN }}
          vercel_project_id: ${{ secrets.VERCEL_PROJECT_ID }}
          vercel_org_id: ${{ secrets.VERCEL_ORG_ID }}

  # 5) Smoke DEV
  smoke-dev:
    if: ${{ github.ref == 'refs/heads/dev' }}
    needs: [migrate-dev, resolve-url]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - uses: ./.github/actions/smoke-health
        with:
          base_url: ${{ needs.resolve-url.outputs.base_url }}
      - name: Notify Discord on failure
        if: ${{ failure() }}
        uses: ./.github/actions/discord-notify
        with:
          webhook_url: ${{ secrets.DISCORD_WEBHOOK }}
          event_type: dev_smoke_failed

  # 6) Smoke TEST
  smoke-test:
    if: ${{ github.ref == 'refs/heads/test' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork == false) }}
    needs: [migrate-test, resolve-url]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - uses: ./.github/actions/smoke-health
        with:
          base_url: ${{ needs.resolve-url.outputs.base_url }}
      - name: Notify Discord on failure
        if: ${{ failure() }}
        uses: ./.github/actions/discord-notify
        with:
          webhook_url: ${{ secrets.DISCORD_WEBHOOK }}
          event_type: test_smoke_failed

  # 7) E2E (reusable) — runs on push `test` only; a PR to main has the same head
  # commit as `test` and resolves the same Vercel preview, so re-running on the PR
  # would re-test an identical deployment.
  e2e-test:
    if: ${{ github.ref == 'refs/heads/test' }}
    needs: [smoke-test, resolve-url]
    uses: ./.github/workflows/_e2e.yml
    secrets: inherit
    with:
      base_url: ${{ needs.resolve-url.outputs.base_url }}
      node_version: ${{ vars.NODE_VERSION }}

  # 7b) Notify on E2E failure (reusable workflow cannot call the action directly)
  notify-e2e-failed:
    needs: e2e-test
    if: ${{ failure() && needs.e2e-test.result == 'failure' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - uses: ./.github/actions/discord-notify
        with:
          webhook_url: ${{ secrets.DISCORD_WEBHOOK }}
          event_type: test_e2e_failed

  # 8) PROD migrate + smoke (main)
  migrate-prod:
    if: ${{ github.ref == 'refs/heads/main' }}
    needs: ci
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ vars.VERCEL_APP_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-npm
        with:
          node_version: ${{ vars.NODE_VERSION }}
      - uses: ./.github/actions/prisma-migrate
        with:
          database_url: ${{ secrets.KOOKIO_MIGRATE_CONNECTION }}
          direct_database_url: ${{ secrets.KOOKIO_MIGRATE_CONNECTION }}
          seed_admin_email: ${{ secrets.SEED_ADMIN_EMAIL }}
          seed_admin_password: ${{ secrets.SEED_ADMIN_PASSWORD }}
          firebase_service_account_json_b64: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON_B64 }}
      - name: Notify Discord on failure (with mention)
        if: ${{ failure() }}
        uses: ./.github/actions/discord-notify
        with:
          webhook_url: ${{ secrets.DISCORD_WEBHOOK }}
          event_type: prod_migrate_failed
          mention_user_id: ${{ secrets.DISCORD_MENTION_USER_ID }}

  smoke-prod:
    if: ${{ github.ref == 'refs/heads/main' }}
    needs: migrate-prod
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - uses: ./.github/actions/smoke-health
        with:
          base_url: ${{ vars.VERCEL_APP_URL }}
      - name: Notify Discord on failure (with mention)
        if: ${{ failure() }}
        uses: ./.github/actions/discord-notify
        with:
          webhook_url: ${{ secrets.DISCORD_WEBHOOK }}
          event_type: prod_smoke_failed
          mention_user_id: ${{ secrets.DISCORD_MENTION_USER_ID }}
      - name: Notify Discord on success (prod deploy, no mention)
        if: ${{ success() }}
        uses: ./.github/actions/discord-notify
        with:
          webhook_url: ${{ secrets.DISCORD_WEBHOOK }}
          event_type: prod_deploy_success

  # 9) Notify email (unchanged)
  notify-email:
    needs:
      [
        ci,
        migrate-dev,
        migrate-test,
        resolve-url,
        smoke-dev,
        smoke-test,
        e2e-test,
        migrate-prod,
        smoke-prod,
      ]
    if: ${{ failure() }}
    runs-on: ubuntu-latest
    steps:
      - name: Send email on failure
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ vars.SMTP_SERVER }}
          server_port: ${{ vars.SMTP_PORT }}
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}
          subject: '❌ CI/CD issue in ${{ github.repository }} @ ${{ github.ref_name }} (run #${{ github.run_number }})'
          to: ${{ secrets.ALERT_EMAIL_TO }}
          from: ${{ secrets.ALERT_EMAIL_FROM }}
          secure: true
          html_body: |
            <h3>CI/CD failure detected</h3>
            <p><b>Repo:</b> ${{ github.repository }}</p>
            <p><b>Branch:</b> ${{ github.ref_name }}</p>
            <p><b>Commit:</b> ${{ github.sha }}</p>
            <p><b>Workflow:</b> ${{ github.workflow }} — run #${{ github.run_number }}</p>
            <p><b>Logs:</b> <a href="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}">open in GitHub Actions</a></p>
