name: CI & Migrate
on:
  push:
    branches: [main, test, dev]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ci-cd-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 1) CI (reusable)
  ci:
    uses: ./.github/workflows/_ci.yml
    with:
      node_version: ${{ vars.NODE_VERSION }}

  # 2) Migrate DEV
  migrate-dev:
    if: ${{ github.ref == 'refs/heads/dev' }}
    needs: ci
    runs-on: ubuntu-latest
    environment: development
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-npm
        with:
          node_version: ${{ vars.NODE_VERSION }}
      - uses: ./.github/actions/prisma-migrate
        with:
          database_url: ${{ secrets.KOOKIO_MIGRATE_CONNECTION }}
          seed_user_id: ${{ secrets.SEED_USER_ID }}

  # 3) Migrate TEST
  migrate-test:
    if: ${{ github.ref == 'refs/heads/test' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork == false) }}
    needs: ci
    runs-on: ubuntu-latest
    environment: testing
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-npm
        with:
          node_version: ${{ vars.NODE_VERSION }}
      - uses: ./.github/actions/prisma-migrate
        with:
          database_url: ${{ secrets.KOOKIO_MIGRATE_CONNECTION }}
          seed_user_id: ${{ secrets.SEED_USER_ID }}

  # 4) Resolve URL (dev/test/PR)
  resolve-url:
    if: ${{ github.ref == 'refs/heads/test' || github.ref == 'refs/heads/dev' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork == false) }}
    needs: [ci]
    runs-on: ubuntu-latest
    outputs:
      base_url: ${{ steps.r.outputs.base_url }}
      source: ${{ steps.r.outputs.source }}
      branch: ${{ steps.r.outputs.branch_used }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: r
        uses: ./.github/actions/resolve-vercel-url
        with:
          vercel_app_url: ${{ vars.VERCEL_APP_URL }}
          vercel_token: ${{ secrets.VERCEL_TOKEN }}
          vercel_project_id: ${{ secrets.VERCEL_PROJECT_ID }}
          vercel_org_id: ${{ secrets.VERCEL_ORG_ID }}

  # 5) Smoke DEV
  smoke-dev:
    if: ${{ github.ref == 'refs/heads/dev' }}
    needs: [migrate-dev, resolve-url]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/smoke-health
        with:
          base_url: ${{ needs.resolve-url.outputs.base_url }}

  # 6) Smoke TEST
  smoke-test:
    if: ${{ github.ref == 'refs/heads/test' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork == false) }}
    needs: [migrate-test, resolve-url]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/smoke-health
        with:
          base_url: ${{ needs.resolve-url.outputs.base_url }}

  # 7) E2E (reusable or direct composite)
  e2e-test:
    if: ${{ github.ref == 'refs/heads/test' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork == false) }}
    needs: [smoke-test, resolve-url]
    uses: ./.github/workflows/_e2e.yml
    secrets: inherit
    with:
      base_url: ${{ needs.resolve-url.outputs.base_url }}
      node_version: ${{ vars.NODE_VERSION }}

  # 8) PROD migrate + smoke (main)
  migrate-prod:
    if: ${{ github.ref == 'refs/heads/main' }}
    needs: ci
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ vars.VERCEL_APP_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-npm
        with:
          node_version: ${{ vars.NODE_VERSION }}
      - uses: ./.github/actions/prisma-migrate
        with:
          database_url: ${{ secrets.KOOKIO_MIGRATE_CONNECTION }}
          seed_user_id: ${{ secrets.SEED_USER_ID }}

  smoke-prod:
    if: ${{ github.ref == 'refs/heads/main' }}
    needs: migrate-prod
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/smoke-health
        with:
          base_url: ${{ vars.VERCEL_APP_URL }}

  # 9) Notify (la final)
  notify-email:
    needs:
      [
        ci,
        migrate-dev,
        migrate-test,
        resolve-url,
        smoke-dev,
        smoke-test,
        e2e-test,
        migrate-prod,
        smoke-prod,
      ]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Send email on failure
        if: ${{ needs.ci.result != 'success' || needs.migrate-dev.result == 'failure' || needs.migrate-test.result == 'failure' || needs.resolve-url.result == 'failure' || needs.smoke-dev.result == 'failure' || needs.smoke-test.result == 'failure' || needs.e2e-test.result == 'failure' || needs.migrate-prod.result == 'failure' || needs.smoke-prod.result == 'failure' }}
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ vars.SMTP_SERVER }}
          server_port: ${{ vars.SMTP_PORT }}
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}
          subject: '❌ CI/CD issue in ${{ github.repository }} @ ${{ github.ref_name }} (run #${{ github.run_number }})'
          to: ${{ secrets.ALERT_EMAIL_TO }}
          from: ${{ secrets.ALERT_EMAIL_FROM }}
          secure: true
          html_body: |
            <h3>CI/CD failure detected</h3>
            <p><b>Repo:</b> ${{ github.repository }}</p>
            <p><b>Branch:</b> ${{ github.ref_name }}</p>
            <p><b>Commit:</b> ${{ github.sha }}</p>
            <p><b>Workflow:</b> ${{ github.workflow }} — run #${{ github.run_number }}</p>
            <p><b>Logs:</b> <a href="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}">open in GitHub Actions</a></p>
