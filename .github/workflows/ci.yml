name: CI & Migrate

on:
  push:
    branches: [main, test, dev]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ci-cd-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 20

jobs:
  # --------------------------
  # CI (lint/test/build)
  # --------------------------
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install
        run: npm ci --legacy-peer-deps

      # Base/head for Nx (PR)
      - name: Set NX base/head (pull_request)
        if: github.event_name == 'pull_request'
        run: |
          echo "NX_BASE=${{ github.event.pull_request.base.sha }}" >> $GITHUB_ENV
          echo "NX_HEAD=${{ github.event.pull_request.head.sha }}" >> $GITHUB_ENV

      # Base/head for Nx (push)
      - name: Set NX base/head (push)
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail

          BEFORE="${{ github.event.before }}"
          HEAD="${{ github.sha }}"

          if [ -z "${BEFORE}" ] || [[ "${BEFORE}" =~ ^0+$ ]]; then
            if git rev-parse --verify "${HEAD}~1" >/dev/null 2>&1; then
              BEFORE="$(git rev-parse "${HEAD}~1")"
            else
              BEFORE="${HEAD}"
            fi
          fi

          echo "NX_BASE=${BEFORE}" >> "$GITHUB_ENV"
          echo "NX_HEAD=${HEAD}" >> "$GITHUB_ENV"

      - name: Format check (affected)
        run: npx nx format:check --base=$NX_BASE --head=$NX_HEAD

      - name: Lint / Test / Build
        run: npx nx run-many -t lint test build --output-style=stream

  # --------------------------
  # Migrate DEV (dev branch)
  # --------------------------
  migrate-dev:
    needs: ci
    if: ${{ github.ref == 'refs/heads/dev' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: development
    concurrency:
      group: db-migrate-dev
      cancel-in-progress: false
    env:
      DATABASE_URL: ${{ secrets.KOOKIO_MIGRATE_CONNECTION }}
      SEED_USER_ID: ${{ secrets.SEED_USER_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install
        run: npm ci --legacy-peer-deps

      - name: Prisma migrate deploy (DEV) — retry
        run: |
          set -e
          attempts=3
          delay=10
          ok=0
          for i in $(seq 1 $attempts); do
            echo "Attempt $i/$attempts: prisma migrate deploy (DEV)"
            if npx nx migrate-deploy prisma-client; then
              ok=1
              break
            fi
            echo "Failed attempt $i. Retrying in ${delay}s..."
            sleep $delay
            delay=$((delay*2))
          done
          if [ "$ok" -ne 1 ]; then
            echo "❌ prisma migrate deploy (DEV) failed after $attempts attempts"
            exit 1
          fi

      - name: Optional seed (DEV)
        if: ${{ env.DATABASE_URL != '' && env.SEED_USER_ID != '' }}
        env:
          SEED_USER_ID: ${{ secrets.SEED_USER_ID }}
        run: npx nx seed prisma-client

  # --------------------------
  # Migrate TEST (test branch + PRs to main)
  # --------------------------
  migrate-test:
    needs: ci
    if: ${{ github.ref == 'refs/heads/test' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork == false) }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: testing
    concurrency:
      group: db-migrate-test-${{ github.ref }}
      cancel-in-progress: false
    env:
      DATABASE_URL: ${{ secrets.KOOKIO_MIGRATE_CONNECTION }}
      SEED_USER_ID: ${{ secrets.SEED_USER_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install
        run: npm ci --legacy-peer-deps

      - name: Prisma migrate deploy (TEST) — retry
        run: |
          set -e
          attempts=3
          delay=10
          ok=0
          for i in $(seq 1 $attempts); do
            echo "Attempt $i/$attempts: prisma migrate deploy (TEST)"
            if npx nx migrate-deploy prisma-client; then
              ok=1
              break
            fi
            echo "Failed attempt $i. Retrying in ${delay}s..."
            sleep $delay
            delay=$((delay*2))
          done
          if [ "$ok" -ne 1 ]; then
            echo "❌ prisma migrate deploy (TEST) failed after $attempts attempts"
            exit 1
          fi

      - name: Optional seed (TEST)
        if: ${{ env.DATABASE_URL != '' && env.SEED_USER_ID != '' }}
        env:
          SEED_USER_ID: ${{ secrets.SEED_USER_ID }}
        run: npx nx seed prisma-client

  # --------------------------
  # Resolve URL (for dev/test/PR), via Vercel API or override var
  # --------------------------
  resolve-url:
    needs: [ci]
    if: ${{ github.ref == 'refs/heads/test' || github.ref == 'refs/heads/dev' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork == false) }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      base_url: ${{ steps.resolve.outputs.base_url }}
      source: ${{ steps.resolve.outputs.source }}
      branch_used: ${{ steps.resolve.outputs.branch_used }}
    steps:
      - name: Resolve TEST Base URL
        id: resolve
        env:
          VERCEL_APP_URL: ${{ vars.VERCEL_APP_URL }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          REF_NAME: ${{ github.ref_name }}
          HEAD_REF: ${{ github.head_ref }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -e

          # Use PR head ref when available; else use ref name
          BRANCH="$REF_NAME"
          if [ "$EVENT_NAME" = "pull_request" ] && [ -n "$HEAD_REF" ]; then
            BRANCH="$HEAD_REF"
          fi
          echo "branch_used=$BRANCH" >> "$GITHUB_OUTPUT"

          # 1) Prefer explicit override URL
          if [ -n "$VERCEL_APP_URL" ]; then
            echo "base_url=$VERCEL_APP_URL" >> "$GITHUB_OUTPUT"
            echo "source=vars" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # 2) Query Vercel API for latest READY preview for this branch
          if [ -n "$VERCEL_TOKEN" ] && [ -n "$VERCEL_PROJECT_ID" ] && [ -n "$VERCEL_ORG_ID" ]; then
            sudo apt-get update && sudo apt-get install -y jq > /dev/null

            url=$(
              curl -fsSL -H "Authorization: Bearer $VERCEL_TOKEN" \
                "https://api.vercel.com/v6/deployments?projectId=$VERCEL_PROJECT_ID&teamId=$VERCEL_ORG_ID&limit=30" \
              | jq -r --arg b "$BRANCH" '
                  .deployments[]
                  | select(.state=="READY")
                  | select(.target=="preview")
                  | select(.meta.githubCommitRef==$b)
                  | .url
                ' | head -n 1
            )

            if [ -n "$url" ]; then
              echo "base_url=https://$url" >> "$GITHUB_OUTPUT"
              echo "source=vercel" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi

          echo "base_url=" >> "$GITHUB_OUTPUT"
          echo "source=none" >> "$GITHUB_OUTPUT"

  # --------------------------
  # Smoke DEV (fast, no E2E)
  # --------------------------
  smoke-dev:
    needs: [ci, migrate-dev, resolve-url]
    if: ${{ github.ref == 'refs/heads/dev' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Smoke GET /api/health (DEV)
        env:
          BASE_URL: ${{ needs.resolve-url.outputs.base_url }}
          SOURCE: ${{ needs.resolve-url.outputs.source }}
          BRANCH: ${{ needs.resolve-url.outputs.branch_used }}
        run: |
          set -e
          echo "Resolve source=$SOURCE branch=$BRANCH base=$BASE_URL"
          if [ -z "$BASE_URL" ]; then
            echo "No DEV BASE_URL resolved; skipping smoke."
            exit 0
          fi

          u="$BASE_URL/api/health"
          echo "Probing $u ..."
          ok=0
          for i in $(seq 1 20); do
            code=$(curl -fsS -o resp.json -w "%{http_code}" "$u" || true)
            if [ "$code" = "200" ]; then
              cat resp.json || true
              ok=1
              break
            fi
            sleep 10
          done

          if [ $ok -ne 1 ]; then
            echo "❌ $u did not become healthy in time"
            exit 1
          fi
          echo "✅ DEV smoke check passed."

  # --------------------------
  # Smoke TEST (for test branch + PRs)
  # --------------------------
  smoke-test:
    needs: [ci, migrate-test, resolve-url]
    if: ${{ github.ref == 'refs/heads/test' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork == false) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Smoke GET /api/health (TEST)
        env:
          BASE_URL: ${{ needs.resolve-url.outputs.base_url }}
          SOURCE: ${{ needs.resolve-url.outputs.source }}
          BRANCH: ${{ needs.resolve-url.outputs.branch_used }}
        run: |
          set -e
          echo "Resolve source=$SOURCE branch=$BRANCH base=$BASE_URL"
          if [ -z "$BASE_URL" ]; then
            echo "No TEST BASE_URL resolved; skipping smoke."
            exit 0
          fi

          u="$BASE_URL/api/health"
          echo "Probing $u ..."
          ok=0
          for i in $(seq 1 20); do
            code=$(curl -fsS -o resp.json -w "%{http_code}" "$u" || true)
            if [ "$code" = "200" ]; then
              cat resp.json || true
              ok=1
              break
            fi
            sleep 10
          done

          if [ $ok -ne 1 ]; then
            echo "❌ $u did not become healthy in time"
            exit 1
          fi
          echo "✅ TEST smoke check passed."

  # --------------------------
  # E2E against TEST URL (test branch + PRs)
  # --------------------------
  e2e-test:
    needs: [ci, migrate-test, resolve-url, smoke-test]
    if: ${{ github.ref == 'refs/heads/test' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork == false) }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: testing
    concurrency:
      group: e2e-test-${{ github.ref }}
      cancel-in-progress: true
    env:
      DATABASE_URL: ${{ secrets.KOOKIO_APP_CONNECTION }}
      PLAYWRIGHT_BASE_URL: ${{ needs.resolve-url.outputs.base_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install
        run: npm ci --legacy-peer-deps

      - name: Install Playwright deps
        run: npx playwright install --with-deps

      - name: E2E against TEST URL
        if: env.PLAYWRIGHT_BASE_URL != ''
        run: npx nx run-many -t e2e --output-style=stream

      - name: Skip E2E (no TEST URL)
        if: env.PLAYWRIGHT_BASE_URL == ''
        run: echo "No TEST URL resolved; skipping E2E."

  # --------------------------
  # Migrate PROD (main branch)
  # --------------------------
  migrate-prod:
    needs: [ci]
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
      url: ${{ vars.VERCEL_APP_URL }}
    concurrency:
      group: db-migrate-prod
      cancel-in-progress: false
    env:
      DATABASE_URL: ${{ secrets.KOOKIO_MIGRATE_CONNECTION }}
      SEED_USER_ID: ${{ secrets.SEED_USER_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install
        run: npm ci --legacy-peer-deps

      - name: Prisma migrate deploy (PROD) — retry
        run: |
          set -e
          attempts=3
          delay=10
          ok=0
          for i in $(seq 1 $attempts); do
            echo "Attempt $i/$attempts: prisma migrate deploy (PROD)"
            if npx nx migrate-deploy prisma-client; then
              ok=1
              break
            fi
            echo "Failed attempt $i. Retrying in ${delay}s..."
            sleep $delay
            delay=$((delay*2))
          done
          if [ "$ok" -ne 1 ]; then
            echo "❌ prisma migrate deploy (PROD) failed after $attempts attempts"
            exit 1
          fi

      - name: Optional seed (PROD)
        if: ${{ env.DATABASE_URL != '' && env.SEED_USER_ID != '' }}
        env:
          SEED_USER_ID: ${{ secrets.SEED_USER_ID }}
        run: npx nx seed prisma-client

  # --------------------------
  # Smoke PROD
  # --------------------------
  smoke-prod:
    needs: migrate-prod
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    concurrency:
      group: smoke-prod
      cancel-in-progress: false
    steps:
      - name: Determine PROD base URL
        env:
          VERCEL_APP_URL: ${{ vars.VERCEL_APP_URL }}
        run: |
          set -e
          BASE_URL="${VERCEL_APP_URL:-https://kookio.app}"
          echo "BASE_URL=$BASE_URL" >> $GITHUB_ENV

      - name: Smoke GET /api/health (with retries)
        env:
          BASE_URL: ${{ env.BASE_URL }}
        run: |
          set -e
          u="$BASE_URL/api/health"
          echo "Probing $u ..."
          ok=0
          for i in $(seq 1 20); do
            code=$(curl -fsS -o resp.json -w "%{http_code}" "$u" || true)
            if [ "$code" = "200" ]; then
              cat resp.json || true
              ok=1
              break
            fi
            sleep 10
          done

          if [ $ok -ne 1 ]; then
            echo "❌ $u did not become healthy in time"
            exit 1
          fi
          echo "✅ PROD smoke check passed."

  # --------------------------
  # Notify on failure (single email job)
  # --------------------------
  notify-email:
    needs:
      [
        ci,
        migrate-dev,
        migrate-test,
        resolve-url,
        smoke-dev,
        smoke-test,
        e2e-test,
        migrate-prod,
        smoke-prod,
      ]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Send email on failure
        if: ${{ needs.ci.result != 'success' || needs.migrate-dev.result == 'failure' || needs.migrate-test.result == 'failure' || needs.resolve-url.result == 'failure' || needs.smoke-dev.result == 'failure' || needs.smoke-test.result == 'failure' || needs.e2e-test.result == 'failure' || needs.migrate-prod.result == 'failure' || needs.smoke-prod.result == 'failure' }}
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ vars.SMTP_SERVER }}
          server_port: ${{ vars.SMTP_PORT }}
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}
          subject: '❌ CI/CD issue in ${{ github.repository }} @ ${{ github.ref_name }} (run #${{ github.run_number }})'
          to: ${{ secrets.ALERT_EMAIL_TO }}
          from: ${{ secrets.ALERT_EMAIL_FROM }}
          secure: true
          html_body: |
            <h3>CI/CD failure detected</h3>
            <p><b>Repo:</b> ${{ github.repository }}</p>
            <p><b>Branch:</b> ${{ github.ref_name }}</p>
            <p><b>Commit:</b> ${{ github.sha }}</p>
            <p><b>Workflow:</b> ${{ github.workflow }} — run #${{ github.run_number }}</p>
            <p><b>Logs:</b> <a href="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}">open in GitHub Actions</a></p>
            <hr/>
            <p>Job results:</p>
            <ul>
              <li>ci: ${{ needs.ci.result }}</li>
              <li>migrate-dev: ${{ needs.migrate-dev.result }}</li>
              <li>migrate-test: ${{ needs.migrate-test.result }}</li>
              <li>resolve-url: ${{ needs.resolve-url.result }}</li>
              <li>smoke-dev: ${{ needs.smoke-dev.result }}</li>
              <li>smoke-test: ${{ needs.smoke-test.result }}</li>
              <li>e2e-test: ${{ needs.e2e-test.result }}</li>
              <li>migrate-prod: ${{ needs.migrate-prod.result }}</li>
              <li>smoke-prod: ${{ needs.smoke-prod.result }}</li>
            </ul>
