name: CI

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  actions: read
  contents: read

jobs:
  main:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          filter: tree:0
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - run: npm ci --legacy-peer-deps
      - run: npx playwright install --with-deps

      - run: npx nx reset

      - name: Prisma generate (must-run-first)
        run: npx nx run prisma-client:generate

      - name: Lint + Unit/Integration (without DB)
        run: CI=1 npx nx run-many -t lint test --parallel=3 --exclude=web-e2e

      - name: Build
        run: npx nx run-many -t build --parallel=3 --exclude=web-e2e