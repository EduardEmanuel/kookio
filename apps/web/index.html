<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Let's kookio it!</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script>
      // Anti-FOUC: apply the persisted theme-override class on <html> before
      // stylesheets load so the first paint already matches the user's choice.
      // ThemeService re-applies the same class idempotently on first inject.
      (function () {
        try {
          var t = localStorage.getItem('kookio-theme');
          if (t === 'light' || t === 'dark') {
            document.documentElement.classList.add(t);
          }
        } catch (e) {
          /* localStorage may throw in Safari private mode — ignore */
        }
      })();
    </script>
    <!--
      Cache-bust query strings on public/ assets that don't get a content
      hash from Vite at build time (PWA icons, manifest, font subset,
      apple-touch hooks). Vercel ships these with `must-revalidate` —
      this `?v=...` is a belt-and-suspenders bump for Chrome's memory
      cache + any aggressive CDN edge. Bump the version on each deploy
      that touches these assets. Auto-injection via a Vite plugin is a
      possible follow-up.
    -->
    <link
      rel="icon"
      type="image/svg+xml"
      href="/icons/pwa/source.svg?v=ASSET_VERSION"
    />
    <link rel="manifest" href="/manifest.webmanifest?v=ASSET_VERSION" />
    <meta name="theme-color" content="#9f3d00" />
    <link
      rel="apple-touch-icon"
      href="/icons/pwa/apple-touch-icon.png?v=ASSET_VERSION"
    />
    <link
      rel="apple-touch-startup-image"
      media="screen and (device-width: 390px) and (device-height: 844px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)"
      href="/icons/pwa/splash-iphone-13.png?v=ASSET_VERSION"
    />
    <link
      rel="apple-touch-startup-image"
      media="screen and (device-width: 414px) and (device-height: 896px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)"
      href="/icons/pwa/splash-iphone-11.png?v=ASSET_VERSION"
    />
    <link
      rel="apple-touch-startup-image"
      media="screen and (device-width: 375px) and (device-height: 667px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)"
      href="/icons/pwa/splash-iphone-se.png?v=ASSET_VERSION"
    />
    <link rel="stylesheet" href="/src/styles/kookio-fonts.css" />
    <link
      rel="preload"
      href="/fonts/material-symbols/MaterialSymbolsOutlined-variable.woff2?v=ASSET_VERSION"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link rel="stylesheet" href="/src/styles/kookio-tokens.css" />
    <link rel="stylesheet" href="/src/styles/kookio-icons.css" />
    <link rel="stylesheet" href="/src/styles/kookio-material.css" />
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body class="mat-app-background mat-typography">
    <kookio-root></kookio-root>
    <script type="module" src="/src/main.ts"></script>
    <script>
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('/sw.js');
      }
    </script>
  </body>
</html>
