<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Let's kookio it!</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script>
      // Anti-FOUC: apply the persisted theme-override class on <html> before
      // stylesheets load so the first paint already matches the user's choice.
      // ThemeService re-applies the same class idempotently on first inject.
      (function () {
        try {
          var t = localStorage.getItem('kookio-theme');
          if (t === 'light' || t === 'dark') {
            document.documentElement.classList.add(t);
          }
        } catch (e) {
          /* localStorage may throw in Safari private mode — ignore */
        }
      })();
    </script>
    <link rel="icon" type="image/x-icon" href="/icons/kookio/filled/icon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#16a34a" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fredoka:wght@300..700&family=Inter:wght@400;500;700&family=Roboto:wght@300;400;500&display=swap"
      rel="stylesheet"
    />
    <link
      rel="preload"
      href="/fonts/material-symbols/MaterialSymbolsOutlined-variable.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link rel="stylesheet" href="/src/styles/kookio-tokens.css" />
    <link rel="stylesheet" href="/src/styles/kookio-icons.css" />
    <link rel="stylesheet" href="/src/styles/kookio-material.css" />
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body class="mat-app-background mat-typography">
    <kookio-root></kookio-root>
    <script type="module" src="/src/main.ts"></script>
    <script>
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('/sw.js');
      }
    </script>
  </body>
</html>
