<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 130 50">

  <!-- "Let's" - neschimbat (poziție perfectă) -->
  <text x="65" y="21"
        text-anchor="middle"
        font-family="Fredoka, sans-serif"
        font-size="18" font-weight="bold"
        fill="#F17026">Let’s</text>

  <!-- Cercul portocaliu - neschimbat -->
  <circle cx="18" cy="32" r="15" fill="#F17026"/>

  <!-- Coada de tigaie - ridicată cu ~1.7 unități pentru gap estetic -->
  <rect x="30" y="11" width="15" height="5" rx="1.5"
        transform="rotate(-45 37.5 17.5)"
        fill="#F17026"/>

  <!-- Litera K - neschimbată -->
  <text x="18" y="40"
        text-anchor="middle"
        font-family="Fredoka, sans-serif"
        font-size="24" font-weight="bold"
        fill="#FFFFFF">K</text>

  <!-- "ookio it!" - neschimbat -->
  <text x="34" y="40"
        text-anchor="start"
        font-family="Fredoka, sans-serif"
        font-size="22" font-weight="bold"
        fill="#F17026">ookio it!</text>
</svg>