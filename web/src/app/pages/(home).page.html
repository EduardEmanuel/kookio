<div [style.display]="'flex'" [style.alignItems]="'center'" [style.gap.px]="16">
  <mat-icon [style.min-width.px]="95" [style.min-height.px]="38" svgIcon="kookio:logo"></mat-icon>
<h1>Welcome {{ message }}</h1>
</div>
<ol>
  @for (ingredient of ingredientService.ingredients(); track ingredient.userId) {
    <li>{{$index}}: {{ ingredient.name }}</li>
  }
</ol>
