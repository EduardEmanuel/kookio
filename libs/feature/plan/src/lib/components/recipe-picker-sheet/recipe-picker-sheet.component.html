<header class="sheet__header">
  <mat-chip
    class="sheet__header-chip"
    (removed)="onCancel()"
    aria-label="Pick a recipe — close"
  >
    Pick a recipe
    <button matChipRemove type="button" aria-label="Close picker">
      <kookio-icon name="close" />
    </button>
  </mat-chip>

  <mat-button-toggle-group
    class="sheet__levels"
    [value]="level()"
    (change)="onLevelChange($event.value)"
    hideSingleSelectionIndicator
    aria-label="Match level"
  >
    <mat-button-toggle value="Alright" aria-label="I have everything">
      <kookio-icon name="check_circle" />
      Alright
    </mat-button-toggle>
    <mat-button-toggle value="Almost" aria-label="Almost there">
      <kookio-icon name="warning" />
      Almost
    </mat-button-toggle>
    <mat-button-toggle value="All" aria-label="All recipes">
      <kookio-icon name="restaurant_menu" />
      All
    </mat-button-toggle>
  </mat-button-toggle-group>

  <p class="sheet__levelhint">{{ levelHint() }}</p>
</header>

@if (errorMessage(); as msg) {
  <p class="sheet__error" role="alert">{{ msg }}</p>
}

<cdk-virtual-scroll-viewport
  class="sheet__viewport"
  [itemSize]="itemSize"
  (scrolledIndexChange)="onScrolledIndexChange()"
  role="list"
  aria-label="Recipes"
>
  <article
    *cdkVirtualFor="
      let recipe of items();
      trackBy: trackById;
      templateCacheSize: 0
    "
    class="sheet__item"
    role="listitem"
    tabindex="0"
    (click)="onSelect(recipe)"
    (keydown.enter)="onSelect(recipe)"
    (keydown.space)="onSelect(recipe)"
  >
    <kookio-recipe-match-card-compact [item]="recipe" />
  </article>

  @if (isLoading()) {
    <div class="sheet__spinner" aria-live="polite">
      <mat-spinner diameter="32" />
    </div>
  }
</cdk-virtual-scroll-viewport>

@if (
  hasLoadedOnce() &&
  items().length === 0 &&
  !isLoading() &&
  errorMessage() === null
) {
  <p class="sheet__empty">No recipes match this level.</p>
}
