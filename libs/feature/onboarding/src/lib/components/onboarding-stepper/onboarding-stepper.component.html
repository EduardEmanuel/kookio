<!--
  i18n migration: replace each i18n: @@key comment with the matching
  i18n="@@key" attribute (or i18n-label="@@key" for property bindings) once
  @angular/localize is wired up.
-->
<div class="onboarding-shell">
  <mat-card class="onboarding-shell__card" appearance="outlined">
    <mat-stepper
      class="onboarding-shell__stepper"
      orientation="vertical"
      [linear]="false"
      [selectedIndex]="store.currentStep()"
      (selectionChange)="onStepperSelectionChange($event)"
    >
      <mat-step [label]="stepLabels[0]">
        <div class="onboarding-shell__body">
          <kookio-onboarding-start-step />
        </div>
      </mat-step>

      <mat-step [label]="stepLabels[1]">
        <div class="onboarding-shell__body">
          <kookio-onboarding-fridge-step />
        </div>
      </mat-step>

      <mat-step [label]="stepLabels[2]">
        <div class="onboarding-shell__body">
          <kookio-onboarding-utensils-step />
        </div>
      </mat-step>

      <mat-step [label]="stepLabels[3]">
        <div class="onboarding-shell__body">
          <kookio-onboarding-people-step />
        </div>
      </mat-step>

      <mat-step [label]="stepLabels[4]">
        <div class="onboarding-shell__body">
          <kookio-onboarding-restrictions-step />
        </div>
      </mat-step>

      <mat-step [label]="stepLabels[5]">
        <div class="onboarding-shell__body">
          <kookio-onboarding-done-step />
        </div>
      </mat-step>
    </mat-stepper>

    <mat-divider />

    <mat-card-actions class="onboarding-shell__footer" align="end">
      @if (store.canGoPrev() && !store.isLastStep()) {
        <button matButton type="button" (click)="onPrev()">
          <kookio-icon name="arrow_back" />
          <!-- i18n: @@onboarding.action.back -->
          <span>{{ actions.back }}</span>
        </button>
      }

      @if (canSkip()) {
        <button
          class="onboarding-shell__skip"
          matButton
          type="button"
          (click)="onSkip()"
        >
          <!-- i18n: @@onboarding.action.skip -->
          <span>{{ actions.skip }}</span>
        </button>
      }

      @if (store.isFirstStep()) {
        <button matButton="filled" type="button" (click)="onNext()">
          <!-- i18n: @@onboarding.action.start -->
          <span>{{ actions.start }}</span>
          <kookio-icon iconPositionEnd name="arrow_forward" />
        </button>
      } @else if (store.isLastStep()) {
        <button
          matButton="filled"
          type="button"
          [disabled]="store.isSubmitting()"
          (click)="onSubmit()"
        >
          @if (store.isSubmitting()) {
            <mat-progress-spinner mode="indeterminate" diameter="20" />
          } @else {
            <!-- i18n: @@onboarding.action.submit -->
            <span>{{ actions.submit }}</span>
            <kookio-icon iconPositionEnd name="restaurant" />
          }
        </button>
      } @else {
        <button matButton="filled" type="button" (click)="onNext()">
          <!-- i18n: @@onboarding.action.continue -->
          <span>{{ actions.continue }}</span>
          <kookio-icon iconPositionEnd name="arrow_forward" />
        </button>
      }
    </mat-card-actions>

    @if (store.submitError(); as error) {
      <p class="onboarding-shell__error" role="alert">
        <!-- i18n: @@onboarding.error.submit (interpolated) -->
        {{ error }}
      </p>
    }
  </mat-card>
</div>
