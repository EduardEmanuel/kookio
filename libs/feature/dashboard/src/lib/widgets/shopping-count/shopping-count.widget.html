<mat-card class="sc" appearance="outlined">
  <mat-card-content class="sc__content">
    <h2 class="sc__title">
      <kookio-icon name="shopping_cart" />
      <span>Shopping list</span>
    </h2>

    <div class="sc__placeholder">
      <kookio-emoji char="🛒" [size]="40" />
      <p class="sc__count">0 items</p>
      <small class="sc__hint">
        Coming soon — auto-generated from your meal plan.
      </small>
    </div>

    <button [matButton]="'text'" type="button" disabled class="sc__cta">
      <span>View list</span>
      <kookio-icon name="arrow_forward" />
    </button>
  </mat-card-content>
</mat-card>
