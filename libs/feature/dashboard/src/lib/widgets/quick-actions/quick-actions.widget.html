<mat-card class="qa" appearance="outlined">
  <mat-card-content class="qa__content">
    <h2 class="qa__title">
      <kookio-icon name="bolt" />
      <span>Quick actions</span>
    </h2>

    <div class="qa__buttons">
      <a [matButton]="'filled'" routerLink="/recipes/match" class="qa__btn">
        <kookio-icon name="restaurant" />
        <span>Cook with what I have</span>
      </a>

      <a [matButton]="'tonal'" routerLink="/pantry" class="qa__btn">
        <kookio-icon name="kitchen" />
        <span>Manage pantry</span>
      </a>

      <a [matButton]="'tonal'" routerLink="/recipes" class="qa__btn">
        <kookio-icon name="menu_book" />
        <span>Browse recipes</span>
      </a>
    </div>
  </mat-card-content>
</mat-card>
