@if (isVisible()) {
  <a
    matFab
    [extended]="showLabel()"
    routerLink="/recipes/match"
    class="cook-now-fab"
    [matTooltip]="showLabel() ? null : label"
    matTooltipPosition="left"
    [attr.aria-label]="label"
  >
    <kookio-icon name="restaurant" />
    @if (showLabel()) {
      <span class="cook-now-fab__label">{{ label }}</span>
    }
  </a>
}
