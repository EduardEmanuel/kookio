@if (!isHidden()) {
  <nav class="sidenav-menu" role="navigation">
    <mat-nav-list>
      @for (item of items; track item.route) {
        <a
          mat-list-item
          [routerLink]="item.route"
          routerLinkActive="mdc-list-item--activated sidenav-menu__link--active"
          #rla="routerLinkActive"
          [routerLinkActiveOptions]="
            item.route === '/' ? { exact: true } : { exact: false }
          "
        >
          <kookio-icon
            matListItemIcon
            [name]="item.icon"
            [filled]="rla.isActive"
          />
          <span matListItemTitle>{{ item.label }}</span>
        </a>
      }
    </mat-nav-list>
  </nav>
}
