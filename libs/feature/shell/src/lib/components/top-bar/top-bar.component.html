<header class="topbar">
  <a routerLink="/" class="topbar__logo">
    <svg
      xmlns="http://www.w3.org/2000/svg"
      viewBox="0 0 130 50"
      role="img"
      aria-label="Kookio"
      class="topbar__logo-svg"
    >
      <text
        x="65"
        y="21"
        text-anchor="middle"
        font-family="Fredoka, sans-serif"
        font-size="18"
        font-weight="bold"
        fill="var(--md-sys-color-primary, #a04100)"
      >
        Let's
      </text>
      <circle
        cx="18"
        cy="32"
        r="15"
        fill="var(--md-sys-color-primary, #a04100)"
      />
      <rect
        x="30"
        y="11"
        width="15"
        height="5"
        rx="1.5"
        transform="rotate(-45 37.5 17.5)"
        fill="var(--md-sys-color-primary, #a04100)"
      />
      <text
        x="18"
        y="40"
        text-anchor="middle"
        font-family="Fredoka, sans-serif"
        font-size="24"
        font-weight="bold"
        fill="var(--md-sys-color-surface, #fff8f6)"
      >
        K
      </text>
      <text
        x="34"
        y="40"
        text-anchor="start"
        font-family="Fredoka, sans-serif"
        font-size="22"
        font-weight="bold"
        fill="var(--md-sys-color-primary, #a04100)"
      >
        ookio it!
      </text>
    </svg>
  </a>

  <div class="topbar__spacer"></div>

  @if (cookNowVisible()) {
    <a
      matIconButton
      routerLink="/recipes/match"
      matTooltip="Cook now"
      aria-label="Cook now"
      class="topbar__cook-now"
    >
      <svg
        xmlns="http://www.w3.org/2000/svg"
        viewBox="0 0 24 24"
        aria-hidden="true"
        class="topbar__cook-now-icon"
      >
        <circle
          cx="10"
          cy="14"
          r="9"
          fill="var(--md-sys-color-primary, #a04100)"
        />
        <rect
          x="15"
          y="2"
          width="9"
          height="3"
          rx="1"
          transform="rotate(-45 20 3.5)"
          fill="var(--md-sys-color-primary, #a04100)"
        />
        <text
          x="10"
          y="19"
          text-anchor="middle"
          font-family="Fredoka, sans-serif"
          font-size="14"
          font-weight="bold"
          fill="var(--md-sys-color-surface, #fff8f6)"
        >
          K
        </text>
      </svg>
    </a>
  }

  <button
    matIconButton
    [matMenuTriggerFor]="themeMenu"
    matTooltip="Theme"
    aria-label="Theme"
  >
    @switch (theme.mode()) {
      @case ('light') {
        <kookio-icon name="light_mode" />
      }
      @case ('dark') {
        <kookio-icon name="dark_mode" />
      }
      @default {
        <kookio-icon name="settings_suggest" />
      }
    }
  </button>
  <mat-menu #themeMenu xPosition="before" class="topbar__theme-menu">
    <div class="topbar__theme-row topbar__theme-row--checkbox">
      <mat-checkbox
        [checked]="theme.mode() === 'auto'"
        (change)="onAutoChange($event.checked)"
        (click)="$event.stopPropagation()"
      >
        System theme
      </mat-checkbox>
    </div>
    <div class="topbar__theme-row topbar__theme-row--slider">
      <kookio-icon name="light_mode" aria-hidden="true" />
      <mat-slide-toggle
        [checked]="isDarkActive()"
        [disabled]="theme.mode() === 'auto'"
        (change)="onSliderChange($event.checked)"
        (click)="$event.stopPropagation()"
        aria-label="Light or dark theme"
        hideIcon
      />
      <kookio-icon name="dark_mode" aria-hidden="true" />
    </div>
  </mat-menu>

  @if (user()) {
    <button
      matIconButton
      [matMenuTriggerFor]="userMenu"
      matTooltip="User menu"
      aria-label="User menu"
    >
      <kookio-icon name="account_circle" />
    </button>
    <mat-menu #userMenu>
      <a mat-menu-item routerLink="/account">
        <kookio-icon name="person" />
        <span>Account</span>
      </a>
      <a mat-menu-item routerLink="/about">
        <kookio-icon name="info" />
        <span>About</span>
      </a>
      <a mat-menu-item routerLink="/legal/attributions">
        <kookio-icon name="info" />
        <span>Attributions</span>
      </a>
      <button mat-menu-item (click)="logout()">
        <kookio-icon name="logout" />
        <span>Sign out</span>
      </button>
    </mat-menu>
  } @else {
    <a matButton="filled" routerLink="/login">Login</a>
  }
</header>
