<header class="topbar">
  <a routerLink="/" class="topbar__logo">
    <svg
      xmlns="http://www.w3.org/2000/svg"
      viewBox="0 0 130 50"
      role="img"
      aria-label="Kookio"
      class="topbar__logo-svg"
    >
      <text
        x="65"
        y="21"
        text-anchor="middle"
        font-family="Fredoka, sans-serif"
        font-size="18"
        font-weight="bold"
        fill="var(--md-sys-color-primary, #a04100)"
      >
        Let's
      </text>
      <circle
        cx="18"
        cy="32"
        r="15"
        fill="var(--md-sys-color-primary, #a04100)"
      />
      <rect
        x="30"
        y="11"
        width="15"
        height="5"
        rx="1.5"
        transform="rotate(-45 37.5 17.5)"
        fill="var(--md-sys-color-primary, #a04100)"
      />
      <text
        x="18"
        y="40"
        text-anchor="middle"
        font-family="Fredoka, sans-serif"
        font-size="24"
        font-weight="bold"
        fill="var(--md-sys-color-surface, #fff8f6)"
      >
        K
      </text>
      <text
        x="34"
        y="40"
        text-anchor="start"
        font-family="Fredoka, sans-serif"
        font-size="22"
        font-weight="bold"
        fill="var(--md-sys-color-primary, #a04100)"
      >
        ookio it!
      </text>
    </svg>
  </a>

  <div class="topbar__spacer"></div>

  <button mat-icon-button matTooltip="Search recipes" aria-label="Search">
    <kookio-icon name="search" />
  </button>

  @if (user()) {
    <button mat-icon-button [matMenuTriggerFor]="userMenu" aria-label="Account">
      <kookio-icon name="account_circle" />
    </button>
    <mat-menu #userMenu>
      <a mat-menu-item routerLink="/account">
        <kookio-icon name="person" />
        <span>Account</span>
      </a>
      <button mat-menu-item (click)="logout()">
        <kookio-icon name="logout" />
        <span>Sign out</span>
      </button>
    </mat-menu>
  } @else {
    <a mat-flat-button routerLink="/login">Login</a>
  }
</header>
