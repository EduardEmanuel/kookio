@if (!isHidden()) {
  <nav class="bottom-tabs" role="navigation" aria-label="Main menu">
    @for (tab of tabs; track tab.route) {
      <a
        [routerLink]="tab.route"
        routerLinkActive="bottom-tabs__item--active"
        [routerLinkActiveOptions]="
          tab.route === '/' ? { exact: true } : { exact: false }
        "
        class="bottom-tabs__item"
        [attr.aria-label]="tab.label"
      >
        <mat-icon>{{ tab.icon }}</mat-icon>
        <span class="bottom-tabs__label">{{ tab.label }}</span>
      </a>
    }
  </nav>
}
