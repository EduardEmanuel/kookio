@if (!isHidden()) {
  <nav class="bottom-tabs" role="navigation" aria-label="Main menu">
    @for (item of items; track item.route) {
      <a
        [routerLink]="item.route"
        routerLinkActive="bottom-tabs__item--active"
        #rla="routerLinkActive"
        [routerLinkActiveOptions]="
          item.route === '/' ? { exact: true } : { exact: false }
        "
        class="bottom-tabs__item"
        [attr.aria-label]="item.label"
      >
        <kookio-icon [name]="item.icon" [filled]="rla.isActive" />
        <span class="bottom-tabs__label">{{ item.label }}</span>
      </a>
    }
  </nav>
}
