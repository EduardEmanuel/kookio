<div
  class="shell"
  [class.shell--mobile]="isMobile()"
  [class.shell--desktop]="!isMobile()"
>
  <kookio-top-bar class="shell__topbar" />

  @if (isMobile()) {
    <main class="shell__main">
      <router-outlet />
    </main>
    <kookio-bottom-tabs class="shell__bottom-tabs" />
  } @else {
    <mat-sidenav-container class="shell__sidenav-container">
      <mat-sidenav mode="side" opened class="shell__sidenav">
        <kookio-sidenav-menu />
      </mat-sidenav>
      <mat-sidenav-content class="shell__main">
        <router-outlet />
      </mat-sidenav-content>
    </mat-sidenav-container>
  }
</div>
